[project]
name = "paiec"
version = "0.0.1"
description = "Experiments for the Predictive AI Evaluation Competition (NeurIPS 2026)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "pyyaml", "huggingface_hub>=0.25"]

[project.optional-dependencies]
ml = ["torch", "scikit-learn", "lightgbm"]
dev = ["pytest", "ruff"]
report = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["data", "dist", "runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# exploratory analysis scripts: allow quick file handles, NaN self-comparison idiom, loop closures
"analysis/**" = ["SIM115", "PLR0124", "B023", "C401"]
