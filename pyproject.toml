[project]
name = "paiec"
version = "0.0.1"
description = "Experiments for the Predictive AI Evaluation Competition (NeurIPS 2026)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "huggingface_hub"]

[project.optional-dependencies]
ml = ["torch", "scikit-learn", "lightgbm"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["data", "dist", "runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
